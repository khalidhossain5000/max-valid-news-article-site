<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#2563EB"/>

  <!-- Folded newspaper shape -->
  <g>
    <!-- Back page (slightly offset for folded effect) -->
    <rect x="14" y="12" width="30" height="40" rx="2" fill="#1D4ED8"/>

    <!-- Front page -->
    <rect x="10" y="16" width="34" height="34" rx="2" fill="#FFFFFF"/>

    <!-- Headline block -->
    <rect x="15" y="21" width="24" height="6" rx="1" fill="#2563EB"/>

    <!-- Text lines -->
    <rect x="15" y="30" width="24" height="2.5" rx="1" fill="#93C5FD"/>
    <rect x="15" y="35" width="24" height="2.5" rx="1" fill="#93C5FD"/>
    <rect x="15" y="40" width="16" height="2.5" rx="1" fill="#93C5FD"/>
  </g>
</svg>
